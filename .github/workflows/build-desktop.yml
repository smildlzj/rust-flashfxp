name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundle: app
            installer-directory: dmg
            extension: dmg
          - name: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
            installer-directory: dmg
            extension: dmg
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            installer-directory: nsis
            extension: exe
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_TERM_COLOR: always
      NODE_OPTIONS: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm --prefix ui ci

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${config.version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} must match app version v${config.version}`);
          }
          NODE

      - name: Build installer
        working-directory: src-tauri
        run: npx --no-install --prefix ../ui tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundle }}' -- --locked

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'

      - name: Build branded DMG
        if: runner.os == 'macOS'
        env:
          BUNDLE_DIR: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          python -m pip install -r scripts/dmg/requirements.txt
          python scripts/dmg/build.py --app "$BUNDLE_DIR/macos/Rust Flash Ftp.app" --output "$BUNDLE_DIR/dmg/Rust Flash Ftp.dmg"

      - name: Name installer
        id: package
        env:
          INSTALLER_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.installer-directory }}
          INSTALLER_EXTENSION: ${{ matrix.extension }}
          PLATFORM: ${{ matrix.name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const { INSTALLER_DIR, INSTALLER_EXTENSION, PLATFORM } = process.env;
          const files = fs.readdirSync(INSTALLER_DIR, { withFileTypes: true })
            .filter(entry => entry.isFile() && entry.name.endsWith(`.${INSTALLER_EXTENSION}`));
          if (files.length !== 1) {
            throw new Error(`Expected one installer in ${INSTALLER_DIR}, found ${files.length}`);
          }
          const name = `Rust-Flash-Ftp-v${version}-${PLATFORM}`;
          fs.mkdirSync('installers', { recursive: true });
          fs.copyFileSync(path.join(INSTALLER_DIR, files[0].name), `installers/${name}.${INSTALLER_EXTENSION}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact-name=${name}\n`);
          NODE

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: installers/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Rust-Flash-Ftp-*
          path: installers
          merge-multiple: true

      - name: Create release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(installers/*.dmg installers/*.exe)
          if [ "${#installers[@]}" -ne 3 ]; then
            echo 'Expected two macOS DMGs and one Windows x64 installer.' >&2
            exit 1
          fi
          (cd installers && sha256sum *.dmg *.exe > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            options=(--draft)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --title "Rust Flash Ftp $RELEASE_TAG" --generate-notes "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${installers[@]}" installers/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
