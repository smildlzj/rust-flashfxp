[package]
name = "rust-flashfxp-tauri"
version = "0.1.2"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
flashfxp-lib = { path = "..", package = "rust-flashfxp" }
chrono = "0.4"
fs2 = "0.4"
rfd = "0.15"
