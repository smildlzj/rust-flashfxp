[package]
name = "rust-flashfxp"
version = "0.1.3"
edition = "2021"
license = "MIT"

[lib]
name = "flashfxp_lib"
path = "src/lib.rs"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["serde"] }
egui = { version = "0.31", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
suppaftp = { version = "6", features = ["async", "async-rustls", "deprecated"] }
async-std = "1"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
base64 = "0.22"
russh = "0.46"
async-trait = "0.1"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
encoding_rs = "0.8"
chrono = "0.4"
rfd = "0.15"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
